name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'rel/**' ]
    tags:
      - '*'
  pull_request:
    branches: [ 'main' ]


jobs:
  build:
    runs-on: ubuntu-latest
    environment: ngni-omnt
    env:
      OMNT_STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
      OMNT_KEY_ALIAS: ${{ secrets.KEYALIAS }}
      OMNT_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
    steps:
      - name: Checkout Branch ${{ github.ref }}
        uses: actions/checkout@v4
      - name: Get Latest iPerf
        run: |
          wget -O jniLibs.zip https://github.com/omnt/iperf/releases/latest/download/jniLibs
          unzip jniLibs.zip -d app/src/main
          rm jniLibs.zip

      - name: Restore existing OMNT signing key
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE }}
        run: |
          if [[ -n "$ENCODED_STRING" ]]; then
            echo -n "$ENCODED_STRING" | base64 -d > app/keys/OpenMobileNetworkToolkit-key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Generate SPDX
        run: ./gradlew app:spdxSbomForRelease

      - name: Sign APKs with public eSIM keys and optional OMNT key
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          bash .github/scripts/sign-apks.sh "$apksigner" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk

      - name: Get release file apk path
        id: releaseApk
        run: | 
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          mkdir upload
          mv app/build/outputs/apk/debug/app-debug.apk ./upload/omnt-debug.apk
          mv app/build/outputs/apk/release/app-release.apk ./upload/omnt-release.apk
          mv app/build/spdx/release.spdx.json ./upload/release.spdx.json

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnt-${{ steps.releaseApk.outputs.sha_short }}
          path: ./upload
